# Isolation overlay: turn the hardware pulse chain off entirely.
#
# Purpose: measure whether TIMER2 in counter mode is anchoring HFCLK
# on and preventing the CPU from reaching System-ON deep sleep. If
# joined-idle current drops from ~1.6 mA to sub-mA with this applied,
# TIMER2 (or LPCOMP, or one of the PPI channels) is the anchor.
#
# Layer on top of rtt.conf:
#   west build … -- -DEXTRA_CONF_FILE="rtt.conf;no-pulse.conf"
#
# Do NOT ship a build with this — the device won't count anything.
# See docs/working/2026-07-29-blocker2-usb-off.md for the residual
# current investigation this overlay supports.

CONFIG_APP_HW_PULSE_COUNTER=n
