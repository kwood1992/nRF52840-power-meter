# Diagnostic overlay: does chatty immediate-mode logging prevent the
# ZBOSS scheduler from ever seeing a ≥20 ms idle window (and therefore
# from signalling ZB_COMMON_SIGNAL_CAN_SLEEP)?
#
# Isolates that hypothesis by stripping logs entirely at compile time.
# If the INA219 baseline drops from ~12 mA continuous to real sleepy-ED
# behaviour with this overlay, logging chatter is the root cause of the
# broken blocker #1 and a smaller fix (deferred mode + drop DBG levels)
# is warranted. If the baseline stays at ~12 mA, look elsewhere.
#
# Not intended to ship — the app has fatal-path LOG_ERRs that we want
# in prod builds.

CONFIG_LOG=n
