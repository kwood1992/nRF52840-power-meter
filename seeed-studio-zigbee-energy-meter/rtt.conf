# RTT-over-SWD logging overlay for battery / INA219-rig builds (issue #51).
#
# USB is physically unplugged on the current-measurement rig — CDC-ACM
# console is not reachable. This overlay swaps the log backend to Segger
# RTT so LOG_INF/LOG_WRN/LOG_ERR stream over the same 2-wire SWD path
# the Pi already uses for flashing, viewable via `tools/rtt-tail.sh`.
#
# Layered on prj.conf:
#   west build … -- -DEXTRA_CONF_FILE=rtt.conf
#
# Do NOT ship in the USB-dev build — USB-dev iteration wants CDC-ACM
# console. Overlay is diagnostic; keep the on-USB workflow unchanged.

# --- Segger RTT core -------------------------------------------------------
CONFIG_USE_SEGGER_RTT=y

# --- Log backends: RTT on, UART/CDC-ACM off --------------------------------
# LOG_BACKEND_UART=n stops the log subsystem from spraying to CDC-ACM in
# parallel with RTT. Without this, on a USB-attached build the log message
# would go out both channels; on the INA219 rig USB is unplugged so it'd
# only waste cycles.
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# printk() over RTT too, so early-boot printk-only diagnostics land in the
# same stream as the log subsystem output.
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# --- RTT flow control ------------------------------------------------------
# DROP rather than BLOCK: on the INA219 rig the host may not always be
# attached (walk-away runs, host restart mid-capture). BLOCK would stall
# the CPU indefinitely waiting for buffer space, which would ruin the
# current measurement we're trying to take. DROP loses log lines instead
# — the RTT backend logs the drop count next time it drains.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

# Default up-buffer is 1024 B. Bump modestly so the first-second flood of
# init logs (Zephyr banner, drivers, R23 init) doesn't drop on cold-boot
# before rtt-tail.sh's openocd finishes attaching.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# --- Diagnostic app probes -------------------------------------------------
# The whole point of building with rtt.conf right now is to answer the
# #8-blocker-1 question: does zb_get_rx_on_when_idle() stay FALSE after
# join, or does ZBOSS clobber it? Turn the probe on by default whenever
# we're building for RTT.
CONFIG_APP_ZIGBEE_RX_IDLE_PROBE=y
