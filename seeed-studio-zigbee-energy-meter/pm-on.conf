# Isolation overlay: enable Zephyr power management.
#
# Purpose: does CONFIG_PM=y allow the SoC power policy to actually
# gate HFCLK in idle? Without CONFIG_PM the default arch_idle() just
# calls WFI, which on nRF52 enters System-ON idle (HFCLK stays on ==
# ~1.6 mA). With CONFIG_PM the PM subsystem's policy_next_state hook
# can transition into deeper states where the clock controller
# actually releases HFCLK when no peripheral is requesting it.
#
# Bench-prep doc flagged this as risky "NCS 2.9.2 PM_DEVICE ↔ USB
# stack interactions" — but with rtt.conf's USB stack off, that
# concern doesn't apply.
#
# Layer on top of rtt.conf:
#   west build … -- -DEXTRA_CONF_FILE="rtt.conf;pm-on.conf"

CONFIG_PM=y
CONFIG_PM_DEVICE=y
