# USB-dev overlay — layered on top of prj.conf with
#   west build … -- -DEXTRA_CONF_FILE=dev.conf
#
# Turns on the LED signals gated silent-by-default in prj.conf:
#   * 100 ms white boot flash
#   * 50 ms green flash on each 5-min metering report tick
#
# Not to be enabled for battery builds (defeats the "silent on battery"
# contract from #33).
CONFIG_APP_BOOT_FLASH=y
CONFIG_APP_REPORT_HEARTBEAT=y
