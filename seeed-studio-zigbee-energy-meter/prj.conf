# Link the app at the DT-defined code partition offset (0x27000 on the XIAO)
# so it sits above the Adafruit UF2 bootloader's SoftDevice region.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BOOTLOADER_MCUBOOT=n

# NCS 2.9.2 xiao_ble board DT wires zephyr,console to a USB CDC-ACM UART, so
# the USB device stack must be enabled or the CDC-ACM driver's probe fails
# during kernel init and main() never runs. See CONTRIBUTING.md build gotchas.
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="XIAO Zigbee Energy Meter"
CONFIG_USB_DEVICE_MANUFACTURER="kwood1992"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520f
CONFIG_USB_CDC_ACM=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_GPIO=y

# --- Hardware pulse counting: LPCOMP + PPI + TIMER2 (issue #7) ---
#
# The chain lives in src/hw_pulse_counter.c: phototransistor → LPCOMP
# → PPI → TIMER2 (counter mode), plus a second PPI channel from GPIOTE
# on D7 → TIMER2 for the bench-inject path. All of it runs while the
# CPU is asleep in System-ON; the sample loop just calls
# nrfx_timer_capture() every wake to read the current count.
#
# NRFX_GPPI is the peripheral-agnostic PPI helper (works on both PPI
# and DPPI); on nRF52840 it auto-selects NRFX_PPI. NRFX_LPCOMP is
# gated on the `comp` node being switched to compat=nordic,nrf-lpcomp
# in app.overlay. NRFX_TIMER2 requires timer2's DT status=okay (TIMER1 is
# claimed by the 802.15.4 driver — see hw_pulse_counter.c).
# NRFX_GPIOTE0 is already pulled in by Zephyr's GPIO driver, listed
# here for documentation.
CONFIG_NRFX_LPCOMP=y
CONFIG_NRFX_GPPI=y
CONFIG_NRFX_TIMER2=y
CONFIG_NRFX_GPIOTE0=y

# Disable the Zephyr `comparator` shim's auto-init of LPCOMP so we own
# the peripheral end-to-end from hw_pulse_counter.c. Without this the
# shim's SYS_INIT calls nrfx_lpcomp_init() first (with its own event
# handler) and our subsequent init returns NRFX_ERROR_ALREADY, leaving
# LPCOMP running under someone else's config.
CONFIG_COMPARATOR_NRF_LPCOMP=n

# NVS on the DT storage_partition (0x000ec000, 32 KB) — persists the pulse
# accumulator total so it survives resets. Policy lives in persist_policy.[ch].
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# --- Zigbee (ncs-zigbee R23 v1.3.0 add-on, ZBOSS R23 v4.2.2.3) ---
#
# R23 lives outside the NCS tree as an add-on module (pulled in by
# west.yml at modules/lib/ncs-zigbee). ZIGBEE_ADD_ON is the R23 flag —
# do NOT use the in-tree CONFIG_ZIGBEE (R22), which activates the older
# built-in stack under nrf/subsys/zigbee, pulls Partition Manager into
# the build unbidden, and requires a completely different pm_static.yml
# + CRYPTO + SETTINGS_NVS pile of setup to boot at all.
#
# Role: Sleepy End Device. ZBOSS runs on its own thread; the app talks
# to it via zigbee_app.[ch]. See docs/working/2026-07-22-zigbee-join.md
# for the join/reset flow and what needs bench verification.
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y

# Scan all 2.4 GHz Zigbee channels (11–26) during steering instead
# of the default single channel 16. Without this, the device will
# only ever find coordinators on channel 16 — an easy silent
# failure mode when a coordinator ends up on 18, 20, 25 etc. after
# an interference scan. Multi-channel scan adds a few seconds to
# the first steering attempt; that's a one-time cost.
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y

# Debug logging during first-time commissioning. app_utils at DBG
# emits every state transition (steering start, energy scan result,
# beacon received, association attempt) which we need to see when
# a join silently fails. 802.15.4 radio driver log shows TX/RX at
# the MAC layer — proves whether the radio is actually transmitting.
CONFIG_ZIGBEE_APP_UTILS_LOG_LEVEL_DBG=y

# Baseline runtime knobs the R23 samples all set. Mirror
# modules/lib/ncs-zigbee/samples/light_switch/prj.conf (the R23
# sleepy-ED reference). Without HEAP_MEM_POOL_SIZE, ZBOSS's dynamic
# allocations fault; without the bigger workqueue stack, Zigbee work
# items overflow it.
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# Human-readable ZBOSS error strings in the log — turns 0xffffffff-style
# opaque failure codes into "no such entity", "buffer full", etc.
# Costs a few KB of flash for the string table; worth it for debug builds.
CONFIG_ZIGBEE_ERROR_TO_STRING_ENABLED=y

# Disable IPv6/UDP so the Zigbee/802.15.4 stack doesn't pull in the
# wrong network layer. Zigbee is a 15.4-only device — no IP stack.
CONFIG_NET_IPV6=n
CONFIG_NET_IP_ADDR_CHECK=n
CONFIG_NET_UDP=n

# CONFIG_RESET_ON_FATAL_ERROR is intentionally NOT enabled during
# initial R23 bring-up. A fault loop under this option masks the
# Adafruit UF2 bootloader's double-tap-reset window — the board
# resets faster than the user can double-tap, and it looks bricked.
# Leave off until the R23 path boots cleanly on bench, then flip it
# on for the field build. See memory
# `project_reset_on_fatal_masks_bootloader.md`.

CONFIG_BUILD_OUTPUT_UF2=y
