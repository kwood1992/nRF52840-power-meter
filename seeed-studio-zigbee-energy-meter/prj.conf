# Link the app at the DT-defined code partition offset (0x27000 on the XIAO)
# so it sits above the Adafruit UF2 bootloader's SoftDevice region.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BOOTLOADER_MCUBOOT=n

# NCS 2.9.2 xiao_ble board DT wires zephyr,console to a USB CDC-ACM UART, so
# the USB device stack must be enabled or the CDC-ACM driver's probe fails
# during kernel init and main() never runs. See CONTRIBUTING.md build gotchas.
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="XIAO Zigbee Energy Meter"
CONFIG_USB_DEVICE_MANUFACTURER="kwood1992"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520f
CONFIG_USB_CDC_ACM=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_GPIO=y
CONFIG_ADC=y

CONFIG_BUILD_OUTPUT_UF2=y
