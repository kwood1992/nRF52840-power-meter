name: Firmware build

# Compiles the Zephyr application using the exact NCS + ncs-zigbee pairing
# pinned in west.yml. Board targets come from the matrix below — currently
# sense only, see the note there and #75.
#
# Slow relative to ci.yml: a cold run does a full `west update` (sdk-nrf
# plus every NCS module, ~2 GB even shallow-cloned). The cache key is the
# hash of west.yml, so it invalidates exactly when the pinned revisions
# change.
#
# Measured 2026-07-30: cold 4.3 min, cached 2.3 min. Note the cached
# figure depends on the cache action version — under actions/cache@v4 a
# hit ran to 4.9 min, i.e. restoring the 850 MB workspace cost as much as
# re-cloning it and the cache bought nothing. v6 restores at ~130 MB/s and
# the saving is real. If you ever downgrade that action, re-measure before
# assuming the cache is still worth its 850 MB of the 10 GB quota.
#
# The toolchain image sets BASH_ENV=/opt/non-interactive-setup.sh, which
# bash sources for non-interactive shells — so `west`, CMake, ninja and the
# Zephyr SDK are already on PATH inside every `run:` step. Don't add manual
# toolchain sourcing; it will fight the image.
#
# That mechanism is bash-only, and inside a container GitHub Actions
# defaults `run:` steps to `sh -e {0}`, which ignores BASH_ENV entirely and
# fails with "west: not found". The job-level `defaults.run.shell: bash`
# below is what makes the image's own setup apply — don't drop it.

on:
  pull_request:
    paths:
      - 'seeed-studio-zigbee-energy-meter/**'
      - 'west.yml'
      - '.github/workflows/firmware.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware-build:
    name: firmware-build (${{ matrix.variant }})
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v2.9.2
      options: --user root

    defaults:
      run:
        shell: bash

    # Both documented board targets. The plain one used to fail at DTS parse
    # time because app.overlay referenced Sense-only IMU nodes; those moved to
    # overlays/sense.overlay in #75. Keep plain in the matrix — it is the
    # variant the design-doc BOM specifies, and it silently rotted once.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: sense
            board: xiao_ble/nrf52840/sense
          - variant: plain
            board: xiao_ble/nrf52840

    steps:
      # west.yml declares `self: path: nrf52840-power-meter`, so the repo
      # must sit at that path for `west init -l` to resolve the manifest.
      - uses: actions/checkout@v7
        with:
          path: nrf52840-power-meter

      # The container runs as root over a checkout owned by another uid;
      # without this every git call in the west/Zephyr build trips
      # "detected dubious ownership".
      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - name: Cache west workspace
        id: west-cache
        uses: actions/cache@v6
        with:
          path: |
            .west
            bootloader
            modules
            nrf
            nrfxlib
            zephyr
            tools
          key: west-v2.9.2-${{ hashFiles('nrf52840-power-meter/west.yml') }}

      - name: Initialise west workspace
        if: steps.west-cache.outputs.cache-hit != 'true'
        run: west init -l nrf52840-power-meter

      # --narrow plus depth=1 keeps this to the revisions actually pinned
      # rather than full history for every NCS module.
      - name: west update
        if: steps.west-cache.outputs.cache-hit != 'true'
        run: west update --narrow -o=--depth=1

      - name: west zephyr-export
        run: west zephyr-export

      # --no-sysbuild is mandatory, not a preference: NCS 2.9.x sysbuild
      # silently ignores CONFIG_FLASH_LOAD_OFFSET when MCUboot is off, and
      # links the app at VMA 0x0. It builds and flashes cleanly, then
      # hard-faults on boot. See CONTRIBUTING.md "Build gotchas".
      - name: Build
        working-directory: nrf52840-power-meter/seeed-studio-zigbee-energy-meter
        run: west build -b ${{ matrix.board }} --no-sysbuild -p always

      # Guards the same sysbuild bug from the other direction: if the app
      # ever links low again, the reset handler drops below 0x27000 and
      # this fails loudly instead of shipping a brick.
      - name: Verify UF2 vector table lands in the app slot
        working-directory: nrf52840-power-meter/seeed-studio-zigbee-energy-meter
        run: |
          python3 - <<'EOF'
          import struct, sys

          with open('build/zephyr/zephyr.uf2', 'rb') as f:
              d = f.read()

          target = struct.unpack('<I', d[12:16])[0]
          sp     = struct.unpack('<I', d[32:36])[0]
          reset  = struct.unpack('<I', d[36:40])[0]

          print(f'writes to 0x{target:08x}')
          print(f'initial SP    0x{sp:08x}')
          print(f'reset handler 0x{reset:08x}')

          # App slot runs from 0x27000 (above MBR + SoftDevice) up to
          # 0xF4000 (start of the Adafruit UF2 bootloader). The Thumb bit
          # makes the low bit of a valid reset handler 1.
          APP_SLOT_START = 0x00027000
          APP_SLOT_END   = 0x000F4000

          if not (APP_SLOT_START < reset < APP_SLOT_END):
              sys.exit(
                  f'FAIL: reset handler 0x{reset:08x} is outside the app slot '
                  f'(0x{APP_SLOT_START:08x}-0x{APP_SLOT_END:08x}). The flash '
                  'offset was not applied — this firmware would hard-fault on '
                  'boot. Check --no-sysbuild.'
              )

          if target != APP_SLOT_START:
              sys.exit(f'FAIL: UF2 writes to 0x{target:08x}, expected '
                       f'0x{APP_SLOT_START:08x}')

          print('OK: reset handler is inside the app slot')
          EOF

      # The safety net for #75. Splitting the IMU nodes into a separately
      # included overlay traded a loud failure (plain board won't compile) for
      # a potentially silent one (overlay not applied on Sense -> IMU regulator
      # boots ON at ~0.6-1.7 mA, straight into the sleep budget, with a clean
      # build log). This asserts against the *generated* devicetree that the
      # nodes really are disabled, so that failure mode cannot ship quietly.
      #
      # A node we cannot find is a FAILURE, not a pass — otherwise a renamed
      # node would make this check vacuously green, which is the exact trap it
      # exists to prevent.
      - name: Verify Sense-only nodes are disabled in the generated devicetree
        if: matrix.variant == 'sense'
        working-directory: nrf52840-power-meter/seeed-studio-zigbee-energy-meter
        run: |
          python3 - <<'EOF'
          import re, sys

          # Node names as they appear in the flattened DTS, not the labels.
          WANT = [
              r'lsm6ds3tr-c@[0-9a-f]+',   # the IMU itself
              r'lsm6ds3tr-c-en',          # its regulator (P1.08) — the current draw
              r'msm261d3526hicpm-c-en',   # microphone regulator (P1.10)
          ]

          dts = open('build/zephyr/zephyr.dts').read()
          failures = []

          for pattern in WANT:
              m = re.search(r'^([ \t]*)(' + pattern + r')[ \t]*\{', dts, re.M)
              if not m:
                  failures.append(f'{pattern}: node not found in generated '
                                  'devicetree at all — was it renamed upstream? '
                                  'This check cannot silently pass.')
                  continue

              # Walk the node body by brace depth to avoid picking up a
              # status from a sibling or child node.
              i, depth = m.end() - 1, 0
              for i in range(m.end() - 1, len(dts)):
                  if dts[i] == '{':
                      depth += 1
                  elif dts[i] == '}':
                      depth -= 1
                      if depth == 0:
                          break
              body = dts[m.end():i]

              status = re.search(r'status\s*=\s*"([a-z]+)"', body)
              actual = status.group(1) if status else '(no status property)'
              if actual != 'disabled':
                  failures.append(
                      f'{m.group(2)}: status is {actual!r}, expected '
                      "'disabled'. overlays/sense.overlay was not applied — "
                      'check the BOARD MATCHES "sense" guard in CMakeLists.txt.'
                  )
              else:
                  print(f'OK: {m.group(2)} is disabled')

          if failures:
              sys.exit('FAIL:\n  ' + '\n  '.join(failures))

          print('OK: all Sense-only nodes disabled in the generated devicetree')
          EOF

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: zigbee-energy-meter-${{ matrix.variant }}
          path: |
            nrf52840-power-meter/seeed-studio-zigbee-energy-meter/build/zephyr/zephyr.uf2
            nrf52840-power-meter/seeed-studio-zigbee-energy-meter/build/zephyr/zephyr.hex
          if-no-files-found: error
